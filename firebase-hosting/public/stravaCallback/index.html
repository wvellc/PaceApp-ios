<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Connecting to Pace App…</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #151b2e;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.6);
      --accent: #fc4c02; /* Strava orange */
      --accent-text: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2540 0%, var(--bg) 60%), var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .badge {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 26px; color: var(--accent-text);
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: var(--muted); margin: 0 0 20px; }
    .spinner {
      width: 28px; height: 28px; margin: 0 auto 20px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 16px; font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .btn:active { opacity: 0.85; }
    .hidden { display: none !important; }
    .error .badge { background: #b00020; }
    .error .btn { background: #2a3350; }
    .muted-small { font-size: 13px; color: var(--muted); margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="badge" id="badge">✓</div>
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Connecting to Pace App…</h1>
    <p id="message">Returning you to the app to finish linking your Strava account.</p>
    <a class="btn" id="openBtn" href="#">Open Pace App</a>
    <p class="muted-small" id="hint">If nothing happens, tap the button above.</p>
  </div>

  <script>
    (function () {
      // The Pace App custom scheme its deep-link handler listens for.
      var APP_URL = "paceapp://strava-callback";

      var params = new URLSearchParams(window.location.search || "");
      var error = params.get("error");
      var code = params.get("code");

      // Forward the ENTIRE original query string to the app so it receives
      // code/scope/state (or error) exactly as Strava sent them.
      var search = window.location.search || "";
      var target = APP_URL + search;

      var badge = document.getElementById("badge");
      var spinner = document.getElementById("spinner");
      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var openBtn = document.getElementById("openBtn");
      var hint = document.getElementById("hint");
      var card = document.getElementById("card");

      openBtn.setAttribute("href", target);

      if (error || !code) {
        // Authorization was denied or malformed — still hand the error to the app
        // so it can surface a friendly message, but don't pretend it's succeeding.
        card.className = "card error";
        spinner.classList.add("hidden");
        badge.textContent = "!";
        title.textContent = "Strava wasn’t connected";
        message.textContent = error === "access_denied"
          ? "You cancelled the Strava authorization. You can return to the app and try again."
          : "Something went wrong during authorization. Return to the app and try again.";
        openBtn.textContent = "Return to Pace App";
        return;
      }

      // Success: auto-forward to the app. The button is the fallback if the
      // browser blocks the automatic scheme redirect.
      function go() { window.location.replace(target); }

      // Give the page a tick to paint, then redirect.
      setTimeout(go, 250);

      // Some browsers require a user gesture — keep the button working.
      openBtn.addEventListener("click", function (e) {
        e.preventDefault();
        window.location.href = target;
      });
    })();
  </script>
</body>
</html>
