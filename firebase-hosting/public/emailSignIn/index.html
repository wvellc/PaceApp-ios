<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Pace App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      color: #f5f5f7;
    }
    .card {
      text-align: center;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    p  { font-size: 15px; color: #a1a1aa; line-height: 1.5; margin-bottom: 28px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      margin-top: 8px;
    }
    .status { font-size: 14px; color: #71717a; margin-top: 16px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏃</div>

    <!-- Loading state -->
    <div id="state-loading">
      <div class="spinner"></div>
      <h1>Signing you in…</h1>
      <p>Please wait while we verify your link.</p>
    </div>

    <!-- Success / redirect state -->
    <div id="state-redirect" class="hidden">
      <h1>Opening Pace App</h1>
      <p>Tap the button below if the app did not open automatically.</p>
      <a id="open-btn" class="btn" href="#">Open Pace App</a>
      <p class="status" id="status-msg"></p>
    </div>

    <!-- Error state -->
    <div id="state-error" class="hidden">
      <h1>Link Expired</h1>
      <p>This sign-in link has already been used or has expired.<br/>Please request a new one from the app.</p>
    </div>
  </div>

  <!-- Firebase JS SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <script>
    // ─── Firebase config (matches GoogleService-Info.plist) ───────────────────
    const firebaseConfig = {
      apiKey:    "AIzaSyAzZlWv5GFbUuTNou7I670AUqUR88w9nCo",
      projectId: "thepaceapp",
      authDomain: "thepaceapp.firebaseapp.com",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ─── Helpers ──────────────────────────────────────────────────────────────
    function show(id) {
      ["state-loading","state-redirect","state-error"].forEach(s => {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      });
    }

    function setStatus(msg) {
      document.getElementById("status-msg").textContent = msg;
    }

    // ─── Deep-link URL that opens the native app ──────────────────────────────
    // The full current URL (with all Firebase query params) is handed to the app
    // so it can call isSignInWithEmailLink() and complete sign-in natively.
    const isAndroid = /Android/i.test(navigator.userAgent);

    // iOS: the Universal Link domain (thepaceapp.firebaseapp.com) is intercepted
    // by the app, so the same https URL opens it.
    function buildIosLink() {
      return window.location.href;
    }

    // Android: a verified App Link is NOT handed to the app from an in-browser
    // same-origin navigation — Chrome just reloads this page. So force-open the
    // app BY PACKAGE via an intent:// URL (works even if App Link verification
    // failed). The https link rides along as the intent data and still matches
    // the app's /emailSignIn intent-filter; browser_fallback_url catches the
    // app-not-installed case (guarded below so it can't loop).
    function buildAndroidLink() {
      const dataUrl = new URL(window.location.href);
      dataUrl.searchParams.set("appmissing", "1");           // only seen if app is absent
      const fallback = encodeURIComponent(dataUrl.toString());
      const hostPathQuery =
        window.location.host + window.location.pathname + window.location.search;
      return "intent://" + hostPathQuery +
        "#Intent;scheme=https;package=net.paceapp;" +
        "S.browser_fallback_url=" + fallback + ";end";
    }

    // ─── Main ─────────────────────────────────────────────────────────────────
    (async () => {
      if (!auth.isSignInWithEmailLink(window.location.href)) {
        // Not a valid sign-in link — show error
        show("state-error");
        return;
      }

      const appLink = isAndroid ? buildAndroidLink() : buildIosLink();
      document.getElementById("open-btn").href = appLink;
      show("state-redirect");

      // If Android already fell back here because the app isn't installed, don't
      // auto-redirect again (that would loop) — just show the manual button.
      const appMissing = new URLSearchParams(window.location.search).get("appmissing");
      if (isAndroid && appMissing) {
        setStatus("If Pace App didn't open, make sure it's installed, then tap above.");
        return;
      }

      setStatus("Redirecting to the app…");
      try {
        window.location.href = appLink;
      } catch(e) {
        setStatus("Tap the button above to continue.");
      }
    })();
  </script>
</body>
</html>
